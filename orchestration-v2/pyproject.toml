[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "orchestration-v2"
version = "0.2.0"
description = "LangGraph 测试编排引擎 + FastAPI 服务"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4.0",
    "langgraph-checkpoint>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
orchestrator = "api.main:app"
