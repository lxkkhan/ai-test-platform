services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    depends_on:
      - db
      - redis
    env_file: .env
    environment:
      MODE: api
      PLUGIN_DAEMON_URL: http://plugin_daemon:5002
      PLUGIN_DAEMON_KEY: plugin-api-key
    ports:
      - "5001:5001"
    volumes:
      - ./volumes/storage:/app/api/storage
    networks:
      - dify-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    depends_on:
      - db
      - redis
    env_file: .env
    environment:
      MODE: worker
      PLUGIN_DAEMON_URL: http://plugin_daemon:5002
      PLUGIN_DAEMON_KEY: plugin-api-key
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CODE_EXECUTION_API_KEY: dify-sandbox
    volumes:
      - ./volumes/storage:/app/api/storage
    networks:
      - dify-net

  web:
    image: langgenius/dify-web:1.14.2
    restart: always
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      CONSOLE_API_URL: http://127.0.0.1:5001
      SERVER_CONSOLE_API_URL: http://api:5001
      APP_API_URL: http://127.0.0.1:5001
    networks:
      - dify-net

  sandbox:
    image: langgenius/dify-sandbox:0.2.15
    restart: always
    environment:
      API_KEY: dify-sandbox
      GIN_MODE: release
      WORKER_TIMEOUT: '15'
      ENABLE_NETWORK: 'true'
      SANDBOX_PORT: '8194'
    networks:
      - dify-net

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: dify
      POSTGRES_USER: dify
      POSTGRES_PASSWORD: dify123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    networks:
      - dify-net

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - ./volumes/redis:/data
    networks:
      - dify-net

  weaviate:
    image: semitechnologies/weaviate:latest
    restart: always
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: 'none'
    volumes:
      - ./volumes/weaviate:/var/lib/weaviate
    networks:
      - dify-net

  plugin_daemon:
    image: langgenius/dify-plugin-daemon:main-local
    restart: always
    depends_on:
      - db
      - redis
      - api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: dify
      DB_PASSWORD: dify123
      DB_DATABASE: dify_plugin
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      SERVER_PORT: 5002
      SERVER_KEY: plugin-api-key
      MAX_PLUGIN_PACKAGE_SIZE: '52428800'
      PPROF_ENABLED: 'false'
      DIFY_INNER_API_URL: http://api:5001
      DIFY_INNER_API_KEY: plugin-inner-api-key
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: '5003'
      PLUGIN_WORKING_PATH: /app/storage/cwd
      FORCE_VERIFYING_SIGNATURE: 'false'
      PYTHON_ENV_INIT_TIMEOUT: '120'
      PLUGIN_MAX_EXECUTION_TIMEOUT: '600'
      PLUGIN_STDIO_BUFFER_SIZE: '1024'
      PLUGIN_STDIO_MAX_BUFFER_SIZE: '5242880'
      PIP_MIRROR_URL: ''
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
    volumes:
      - ./volumes/storage:/app/storage
    networks:
      - dify-net

networks:
  dify-net:
    driver: bridge
