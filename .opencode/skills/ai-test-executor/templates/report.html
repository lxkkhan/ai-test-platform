<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>AI测试执行报告</title>
<style>
body{font-family:'Microsoft YaHei',sans-serif;padding:20px;background:#f5f5f5}
h1{color:#1890ff}
.summary{background:#fff;padding:20px;border-radius:8px;margin:20px 0;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.summary span{display:inline-block;margin:0 20px 10px 0;font-size:16px}
.pass{color:#52c41a;font-weight:bold}
.fail{color:#ff4d4f;font-weight:bold}
.error{color:#faad14;font-weight:bold}
.case{margin:10px 0;background:#fff;border-radius:8px;padding:15px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.case h3{margin:0 0 10px 0}
.case .step{color:#666;margin:5px 0;font-size:14px}
.case img{max-width:100%;border:1px solid #ddd;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border:1px solid #ddd;padding:6px 8px;text-align:left}
th{background:#f0f0f0}
</style></head><body>
<h1>🤖 AI测试执行报告</h1>
<p>执行时间：{{timestamp}}</p>
<p>测试页面：{{page}}</p>
<p>操作：{{action}}</p>
<div class="summary">
<h2>执行汇总</h2>
<span>总计：<b>{{total}}</b></span>
<span class="pass">通过：<b>{{passed}}</b></span>
<span class="fail">失败：<b>{{failed}}</b></span>
<span class="error">异常：<b>{{errors}}</b></span>
</div>
<h2>详细结果</h2>
{{cases}}
</body></html>
