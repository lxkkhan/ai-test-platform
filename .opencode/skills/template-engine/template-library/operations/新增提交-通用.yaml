# 操作模板：新增提交（通用降级）
# 适用于所有页面的新增提交操作，含 AUTO_TEST_ 数据隔离

操作类型: "新增提交"
目标页面: "通用"
recordCount: 0
sourceCases: []
isGeneric: true

步骤序列:
  - type: "navigate"
    placeholder: "TARGET_PAGE"
    code: "// 导航到目标页面（由匹配引擎自动填充）"
  - type: "waitURL"
    placeholder: "TARGET_URL_PATTERN"
    code: "await page.waitForURL('**/TARGET_URL');"
  - type: "click"
    selector: "button:has-text('新增'), a:has-text('新增'), span:has-text('新增')"
    code: "try { await page.click('button:has-text(\"新增\")', { timeout: 3000 }); } catch { try { await page.click('a:has-text(\"新增\")', { timeout: 3000 }); } catch { await page.click('span:has-text(\"新增\")'); } }"
  - type: "wait"
    selector: ".ant-modal, .ant-drawer, .ant-form"
    code: "await page.waitForSelector('.ant-modal, .ant-drawer, .ant-form', { state: 'visible', timeout: 5000 });"
  - type: "input"
    placeholder: "AUTO_TEST_ 前缀数据"
    code: "// 填写表单数据（由用例生成器填充，所有文本字段加 AUTO_TEST_ 前缀）"
  - type: "click"
    selector: "button:has-text('保存'), button:has-text('提交'), button:has-text('确定')"
    code: "try { await page.click('button:has-text(\"保存\")', { timeout: 3000 }); } catch { try { await page.click('button:has-text(\"提交\")', { timeout: 3000 }); } catch { await page.click('button:has-text(\"确定\")'); } }"
  - type: "wait"
    selector: ".ant-message-success, .ant-notification-success"
    code: "await page.waitForSelector('.ant-message-success, .ant-notification-success', { timeout: 5000 }).catch(() => {});"

断言:
  - type: "visible"
    target: ".ant-message-success, .ant-notification-success"
    expected: "true"
    description: "新增成功提示可见"

数据标记:
  prefix: "AUTO_TEST_"
  strategy: "create"
  cleanup: true