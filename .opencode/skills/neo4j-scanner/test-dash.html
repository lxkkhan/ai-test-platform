<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Test</title></head>
<body>
<div id="out">Loading...</div>
<script>
async function test() {
  const r = await fetch('/api/neo4j', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({statements:[{statement:'MATCH (n)-[r]->(m) RETURN n,r,m LIMIT 5',resultDataContents:['graph']}]})
  });
  const j = await r.json();
  let total = 0;
  for (const row of (j.results?.[0]?.data||[])) {
    if (row.graph) total += row.graph.nodes?.length || 0;
  }
  document.getElementById('out').textContent = 'Total nodes from 5 rows: ' + total;
}
test();
</script>
</body>
</html>
